[workspace]
members = [
    "crates/capture-core",
    "crates/polyglance-cabi",
    "crates/translator-core",
    "crates/translator-providers",
    "crates/translator-uniffi",
    "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
capture-core = { path = "crates/capture-core" }
html-escape = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
translator-core = { path = "crates/translator-core" }
translator-providers = { path = "crates/translator-providers" }
uniffi = "0.32.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"


