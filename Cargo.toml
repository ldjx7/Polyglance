[workspace]
members = [
    "crates/translator-core",
    "crates/translator-providers",
    "crates/translator-uniffi",
    "tools/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1"
html-escape = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
translator-core = { path = "crates/translator-core" }
translator-providers = { path = "crates/translator-providers" }
uniffi = "0.32.0"
