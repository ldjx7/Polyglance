<title>Polyglance 剪贴板验收样本</title>

  body { max-width: 760px; margin: 48px auto; padding: 0 24px; font: 20px/1.7 system-ui, sans-serif; }

<h1>剪贴板富文本样本</h1>
<p>在 Safari 中选择下面框内文字并复制，分别测试普通粘贴、纯文本粘贴和固定文本编辑。</p>
<div class="sample">
  <p>POLYGLANCE-RICH-TEXT：<strong>粗体文字</strong>、<em>斜体文字</em>、<span class="color">蓝色文字</span>。</p>
  <p>第二段包含中文、English、数字 2026，以及符号 &lt; &gt; &amp;。</p>
  <ul><li>有序保存第一项</li><li>有序保存第二项</li></ul>
</div>
<h1>截图与 OCR 样本</h1>
<p>使用 Polyglance 截图下面两行，再在剪贴板历史中识别文字。页面无需网络，没有脚本。</p>
<div class="ocr">CLIPBOARD SEARCH 2026<br>剪贴板搜索测试</div>
