name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package, and publish Polyglance
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION != '' }}
      HAS_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
      HAS_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the tag commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate and export the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Require release notes for this tag
        shell: bash
        run: |
          set -euo pipefail
          release_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$release_notes" ]]; then
            echo "Missing release notes: $release_notes" >&2
            exit 1
          fi

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A single long-lived self-signed identity keeps the app's designated
      # requirement stable across Sparkle replacements.  The private key is
      # supplied only through repository secrets and is never published.
      - name: Import and verify the persistent signing identity
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" || -z "$SIGNING_IDENTITY" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Configure all persistent macOS signing secrets before publishing." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/polyglance-certificate.p12"
          keychain_path="$RUNNER_TEMP/polyglance-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          expected_sha1="$(tr -d '[:space:]' < config/macos-signing-certificate-sha1.txt)"
          actual_sha1="$(security find-certificate -c "$SIGNING_IDENTITY" -Z "$keychain_path" | awk '/SHA-1 hash:/ { print $3; exit }')"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "The imported signing certificate does not match the pinned public fingerprint." >&2
            exit 1
          fi
          # Do not call add-trusted-cert here: every trust domain requires a
          # GUI authorization prompt. codesign can use the imported identity
          # non-interactively via the key partition ACL; Gatekeeper trust is
          # deliberately outside this free, self-signed distribution model.
          echo "CODESIGN_CERTIFICATE_SHA1=$expected_sha1" >> "$GITHUB_ENV"

      - name: Validate the Sparkle signing secret
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Configure the SPARKLE_PRIVATE_KEY repository secret before publishing." >&2
            exit 1
          fi
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/sparkle-private-key"

      - name: Validate the bundled free AI service secret
        shell: bash
        env:
          FREE_AI_OPENROUTER_API_KEY: ${{ secrets.FREE_AI_OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$FREE_AI_OPENROUTER_API_KEY" ]]; then
            echo "Configure the FREE_AI_OPENROUTER_API_KEY repository secret before publishing." >&2
            exit 1
          fi

      - name: Build the generated Rust bridge
        run: ./scripts/build-macos-core.sh

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Swift tests
        run: swift test --package-path apps/macos

      - name: Build the macOS application
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          POLYGLANCE_APPCAST_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          POLYGLANCE_FREE_AI_API_KEY: ${{ secrets.FREE_AI_OPENROUTER_API_KEY }}
          POLYGLANCE_FREE_AI_ENDPOINT: https://openrouter.ai/api/v1
          POLYGLANCE_FREE_AI_MODEL: openrouter/free
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          CODESIGN_TIMESTAMP_MODE: none
        run: |
          set -euo pipefail
          ./scripts/build-macos-app.sh --preserve-permissions

      - name: Notarize the optional Developer ID build
        if: env.HAS_DEVELOPER_ID_IDENTITY == 'true' && env.HAS_NOTARIZATION_APPLE_ID == 'true' && env.HAS_NOTARIZATION_TEAM_ID == 'true' && env.HAS_NOTARIZATION_PASSWORD == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          notarization_archive="$RUNNER_TEMP/Polyglance-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Polyglance.app" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "dist/Polyglance.app"

      - name: Package and sign the update feed
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/polyglance-release"
          archive_name="Polyglance-${VERSION}-macOS.zip"
          dmg_name="Polyglance-${VERSION}-macOS.dmg"
          mkdir -p "$release_directory"
          ditto -c -k --sequesterRsrc --keepParent "dist/Polyglance.app" "$release_directory/$archive_name"
          apps/macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle-private-key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --maximum-versions 1 \
            "$release_directory"
          ./scripts/create-macos-dmg.sh "dist/Polyglance.app" "$release_directory/$dmg_name"
          echo "directory=$release_directory" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg_name" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.package.outputs.directory }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive }}
          DMG_NAME: ${{ steps.package.outputs.dmg }}
          RELEASE_NOTES: docs/releases/${{ github.ref_name }}.md
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Polyglance ${{ steps.version.outputs.number }}" \
              --notes-file "$RELEASE_NOTES"
            gh release upload "$GITHUB_REF_NAME" \
              "$RELEASE_DIRECTORY/$ARCHIVE_NAME" \
              "$RELEASE_DIRECTORY/$DMG_NAME" \
              "$RELEASE_DIRECTORY/appcast.xml" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RELEASE_DIRECTORY/$ARCHIVE_NAME" \
              "$RELEASE_DIRECTORY/$DMG_NAME" \
              "$RELEASE_DIRECTORY/appcast.xml" \
              --verify-tag \
              --notes-file "$RELEASE_NOTES" \
              --title "Polyglance ${{ steps.version.outputs.number }}"
          fi
