name: Clipboard History CI

on:
  push:
    branches: [feat/clipboard-history]
    paths:
      - 'apps/macos/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-macos-*.sh'
      - 'scripts/verify-clipboard-intents.py'
      - 'config/app-intents-protocols.json'
      - '.github/workflows/clipboard-history-ci.yml'
  pull_request:
    paths:
      - 'crates/clipboard-core/**'
      - 'crates/translator-uniffi/**'
      - 'apps/macos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/clipboard-history-ci.yml'
      - 'scripts/build-macos-app.sh'
      - 'scripts/verify-clipboard-intents.py'
      - 'config/app-intents-protocols.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipboard-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test shared Rust logic
        run: cargo test --workspace --locked
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Generate bindings and build the development application
        env:
          CODESIGN_IDENTITY: '-'
        run: ./scripts/build-macos-app.sh
      - name: Test macOS application
        run: |
          swift test --package-path apps/macos --configuration release --filter Clipboard
          swift test --package-path apps/macos --configuration release --skip-build
      - name: Verify development signature
        run: codesign --verify --deep --strict 'dist/Polyglance Dev.app'
      - name: Verify Shortcuts action metadata
        run: python3 scripts/verify-clipboard-intents.py 'dist/Polyglance Dev.app/Contents/Resources/Metadata.appintents'
      - name: Archive development application
        run: ditto -c -k --keepParent 'dist/Polyglance Dev.app' dist/Polyglance-Clipboard-Dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Polyglance-Clipboard-macOS-Dev
          path: dist/Polyglance-Clipboard-Dev.zip
          retention-days: 7
  core-windows:
    # Windows UI is being replaced on refactor/windows-rust-track.
    # Verify the new portable crate on Windows without modifying the legacy C# app.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test -p clipboard-core --locked
