[package]
name = "polyglance-desktop"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[[bin]]
name = "polyglance-desktop"
path = "src/main.rs"

[dependencies]
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
model-core = { path = "../model-core" }
capture-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
semver = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "backend-winit", "raw-window-handle-06", "system-tray"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
translator-core.workspace = true
translator-providers.workspace = true

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
polyglance-cabi = { path = "../polyglance-cabi" }
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
] }
